<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MundiPets — Panel de validaciones</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="container">
  <div class="breadcrumb">Dashboard · Panel de validaciones</div>
  <div class="flex-between" style="flex-wrap:wrap; gap:10px;">
    <h1>Agenda de revisiones</h1>
    <div class="flex gap-8">
      <span class="badge badge-amber" id="pendCount"></span>
      <span class="badge badge-gray" id="revCount">0 en revisión</span>
      <span class="badge badge-green" id="valCount"></span>
    </div>
  </div>

  <div class="card compact">
    <div class="flex gap-8" id="tabs">
      <button class="btn btn-secondary btn-sm active" data-tab="pending">Pendientes</button>
      <button class="btn btn-secondary btn-sm" data-tab="validated">Validadas</button>
      <button class="btn btn-secondary btn-sm" data-tab="rejected">Rechazadas</button>
    </div>
  </div>

  <div class="split">
    <div id="list"></div>
    <div id="detail"></div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const user = Auth.requireLogin();
  renderTopbar(user);

  let tab = "pending";
  let selectedId = qs("recordId");

  document.querySelectorAll("#tabs button").forEach((btn) => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#tabs button").forEach((b) => b.classList.remove("active"));
      btn.classList.add("active");
      tab = btn.dataset.tab;
      selectedId = null;
      render();
    });
  });

  function recordsFor(t) {
    const all = DB.all("medicalRecords");
    if (t === "pending") return all.filter((r) => !r.validated && r.status !== "Rechazado");
    if (t === "validated") return all.filter((r) => r.validated);
    return all.filter((r) => r.status === "Rechazado");
  }

  function render() {
    const all = DB.all("medicalRecords");
    document.getElementById("pendCount").textContent = `${recordsFor("pending").length} pendientes`;
    document.getElementById("valCount").textContent = `${recordsFor("validated").length} validadas`;

    const list = recordsFor(tab);
    if (!selectedId && list.length) selectedId = list[0].id;

    document.getElementById("list").innerHTML = list.length ? list.map((r) => {
      const pet = DB.get("pets", r.petId);
      const active = r.id === selectedId ? "style='border-color:#2563eb;'" : "";
      return `
        <div class="card compact" ${active} style="cursor:pointer;" onclick="selectRecord('${r.id}')">
          <div class="flex-between">
            <div>
              <div style="font-weight:700;">${pet ? escapeHtml(pet.name) : "Mascota"} - ${escapeHtml(r.type)}</div>
              <div class="text-muted" style="font-size:12px;">Cargado el ${escapeHtml(r.date)}</div>
            </div>
            <span class="badge badge-amber">●</span>
          </div>
        </div>
      `;
    }).join("") : `<div class="card empty-state">No hay documentos en esta categoría.</div>`;

    renderDetail();
  }

  function selectRecord(id) { selectedId = id; render(); }
  window.selectRecord = selectRecord;

  function renderDetail() {
    const r = DB.get("medicalRecords", selectedId);
    if (!r) { document.getElementById("detail").innerHTML = ""; return; }
    const pet = DB.get("pets", r.petId);
    const owner = pet ? DB.get("users", pet.ownerId) : null;

    document.getElementById("detail").innerHTML = `
      <div class="card">
        <div class="flex-between">
          <h2>${pet ? escapeHtml(pet.name) : "Mascota"} - ${escapeHtml(r.type)}</h2>
          ${r.validated ? '<span class="badge badge-green">Validado</span>' : r.status === "Rechazado" ? '<span class="badge badge-red">Rechazado</span>' : '<span class="badge badge-amber">Pendiente de validación</span>'}
        </div>
        <div class="text-muted">Propietario: ${owner ? escapeHtml(owner.name) : "—"} · Cargado el ${escapeHtml(r.date)}</div>

        <div class="upload-box mt-16" style="cursor:default;">
          <div>📄</div>
          <div>Vista previa del documento adjunto (simulado en este MVP)</div>
        </div>

        <div class="grid-3 mt-16">
          <div><div class="text-muted" style="font-size:12px;">Mascota</div><div style="font-weight:700;">${pet ? escapeHtml(pet.name) : "—"}</div></div>
          <div><div class="text-muted" style="font-size:12px;">Especie</div><div style="font-weight:700;">${pet ? escapeHtml(pet.species) : "—"}</div></div>
          <div><div class="text-muted" style="font-size:12px;">Tipo de documento</div><div style="font-weight:700;">${escapeHtml(r.type)}</div></div>
        </div>

        <div class="info-banner">Esta revisión valida únicamente la autenticidad del documento cargado. No constituye diagnóstico ni atención clínica veterinaria.</div>

        <label>Observaciones de la revisión</label>
        <textarea id="obsBox" placeholder="Escriba aquí su observación técnica sobre el documento revisado...">${escapeHtml(r.observation || "")}</textarea>

        <div class="flex gap-12 mt-16">
          <button class="btn btn-danger" id="rejectDoc">Rechazar</button>
          <button class="btn btn-secondary" id="holdDoc">Mantener pendiente</button>
          <button class="btn btn-primary" id="validateDoc">Validar documento</button>
        </div>
      </div>
    `;

    document.getElementById("validateDoc").addEventListener("click", () => {
      DB.update("medicalRecords", r.id, { validated: true, status: "Vigente", observation: document.getElementById("obsBox").value });
      toast("Documento validado correctamente (RF-09)");
      render();
    });
    document.getElementById("rejectDoc").addEventListener("click", () => {
      DB.update("medicalRecords", r.id, { validated: false, status: "Rechazado", observation: document.getElementById("obsBox").value });
      toast("Documento rechazado");
      render();
    });
    document.getElementById("holdDoc").addEventListener("click", () => {
      DB.update("medicalRecords", r.id, { observation: document.getElementById("obsBox").value });
      toast("Observación guardada, documento sigue pendiente");
    });
  }

  render();
</script>
</body>
</html>
