<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MundiPets — Perfil de mascota</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="container-narrow">
  <div class="breadcrumb"><a href="explore.html">Explorar mascotas</a> &gt; Perfil</div>

  <div class="card">
    <div class="text-center" style="font-size:90px;" id="petEmoji"></div>
    <span id="statusBadge"></span>
    <h1 id="petName" style="margin-bottom:4px;"></h1>
    <div class="text-muted" id="petMeta"></div>

    <div class="grid-3 mt-24">
      <div class="card compact text-center"><div class="text-muted" style="font-size:12px;">Especie</div><div style="font-weight:700;" id="mSpecies"></div></div>
      <div class="card compact text-center"><div class="text-muted" style="font-size:12px;">Tamaño</div><div style="font-weight:700;" id="mSize"></div></div>
      <div class="card compact text-center"><div class="text-muted" style="font-size:12px;">Ubicación</div><div style="font-weight:700;" id="mCity"></div></div>
    </div>

    <p class="mt-16" id="petDesc"></p>

    <h2>🛡️ Información sanitaria referencial</h2>
    <div id="records"></div>

    <div class="flex gap-12 mt-24">
      <a class="btn btn-primary btn-block" id="contactBtn">Contactar propietario</a>
      <a class="btn btn-secondary" id="compatBtn" style="display:none;">Evaluar compatibilidad</a>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const user = Auth.requireLogin();
  renderTopbar(user);

  const petId = qs("id");
  const pet = DB.get("pets", petId);
  if (!pet) window.location.href = "explore.html";

  document.getElementById("petEmoji").textContent = pet.photo;
  document.getElementById("statusBadge").innerHTML = badgeForPetStatus(pet.status);
  document.getElementById("petName").textContent = pet.name;
  document.getElementById("petMeta").textContent = `${pet.breed} · ${pet.age} · ${pet.sex} · ${pet.reproductiveStatus}`;
  document.getElementById("mSpecies").textContent = pet.species;
  document.getElementById("mSize").textContent = pet.size;
  document.getElementById("mCity").textContent = pet.privacy.location === "public" ? pet.city : "Zona aproximada (privado)";
  document.getElementById("petDesc").textContent = pet.description || "Sin descripción.";

  const records = DB.all("medicalRecords").filter((r) => r.petId === petId);
  document.getElementById("records").innerHTML = records.length ? records.map((r) => `
    <div class="record-row">
      <div>${escapeHtml(r.type)}</div>
      ${badgeForMedicalStatus(r.status)}
    </div>
  `).join("") : `<p class="text-muted">Sin información sanitaria registrada aún.</p>`;

  document.getElementById("contactBtn").addEventListener("click", () => {
    window.location.href = `request.html?petId=${petId}`;
  });

  if (pet.status === "Cruza responsable" && (user.role === "interesado_cruza" || user.role === "propietario")) {
    const btn = document.getElementById("compatBtn");
    btn.style.display = "inline-flex";
    btn.href = `compatibility.html?petId=${petId}`;
  }
</script>
</body>
</html>
