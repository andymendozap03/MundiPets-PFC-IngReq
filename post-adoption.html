<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MundiPets — Seguimiento post-adopción</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="topbar" class="topbar"></div>

<div class="container-narrow">
  <div class="breadcrumb"><a href="dashboard.html">Dashboard</a> &gt; Seguimiento post-adopción</div>
  <h1>Seguimiento post-adopción</h1>
  <p class="subtitle">Mantén un contacto periódico entre adoptante y propietario original tras completarse la adopción (RF-22).</p>

  <div id="content"></div>
</div>

<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/utils.js"></script>
<script>
  const user = Auth.requireLogin();
  renderTopbar(user);

  const petId = qs("petId");

  function render() {
    let followUps = DB.all("followUps");
    if (petId) followUps = followUps.filter((f) => f.petId === petId);
    else followUps = followUps.filter((f) => {
      const req = DB.get("requests", f.requestId);
      const pet = DB.get("pets", f.petId);
      return req && (req.requesterId === user.id || (pet && pet.ownerId === user.id));
    });

    if (followUps.length === 0) {
      document.getElementById("content").innerHTML = `<div class="card empty-state">No hay procesos de seguimiento post-adopción registrados aún. Se generan automáticamente al completar una solicitud de adopción.</div>`;
      return;
    }

    document.getElementById("content").innerHTML = followUps.map((f) => {
      const pet = DB.get("pets", f.petId);
      const req = DB.get("requests", f.requestId);
      return `
        <div class="card">
          <div class="flex-between">
            <h2>${pet ? pet.photo + " " + escapeHtml(pet.name) : "Mascota"}</h2>
            <span class="badge ${f.status === "Pendiente" ? "badge-amber" : "badge-green"}">${escapeHtml(f.status)}</span>
          </div>
          <p><strong>Compromiso de adopción firmado:</strong> ${req ? "Sí, etapa 5/5 completada" : "—"}</p>
          <p><strong>Próximo reporte de seguimiento:</strong> ${escapeHtml(f.date)}</p>
          <p class="text-muted">${escapeHtml(f.note)}</p>
          ${f.status === "Pendiente" ? `<button class="btn btn-primary" onclick="markDone('${f.id}')">Registrar reporte de seguimiento</button>` : `<div class="info-banner">Reporte registrado. Gracias por mantener el compromiso de bienestar animal.</div>`}
        </div>
      `;
    }).join("");
  }

  function markDone(id) {
    const note = prompt("Reporte de seguimiento (estado actual de la mascota):", "La mascota se encuentra en buen estado, adaptándose correctamente.");
    if (note === null) return;
    DB.update("followUps", id, { status: "Completado", note });
    toast("Reporte de seguimiento registrado");
    render();
  }
  window.markDone = markDone;

  render();
</script>
</body>
</html>
